<!-- header.component.html -->


<nav>
    <div class="logo">
        <img src="../../../../../assets/images/shared/logo.svg" alt="Logo">
    </div>

    <div class="second-half">
        <div class="profile-info">

            <img *ngIf="headerInformation.profileUrl; else defaultImage" [src]="headerInformation.profileUrl"
                alt="Profile Picture">
            <ng-template #defaultImage>
                <img src="../../../../../assets/images/shared/not-registred-user-photo.png" alt="Profile Picture">
            </ng-template>
            @if(headerInformation.profileNickName){
            <span>{{headerInformation.profileNickName}}</span>
            }
            @else {
            <span>Default</span>
            }

        </div>
        <div class="menu-dropdown">
            <img src="../../../../../assets/images/shared/down-arrow.svg" alt="Dropdown Icon" (click)="toggleMenu()">
            <div *ngIf="menuOpen" class="dropdown-content">
                <div class="item-menu-dropdown">
                    <img src="../../../../../assets/images/shared/profile-button-image.svg" alt="Profile Picture">
                    <a (click)="goToProfile()">Perfil</a>
                </div>
                <div class="item-menu-dropdown">
                    <img src="../../../../../assets/images/shared/logout.svg" alt="Settings Icon">
                    <a (click)="logout()">Sair</a>
                </div>
            </div>
        </div>
    </div>

</nav>
